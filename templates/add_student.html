{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <a href="{{ url_for('view_students') }}" class="back-link">← Back to Students</a>
    <h1 class="page-title">➕ Add Student</h1>
    <p class="page-sub">Register a new student record</p>
  </div>
</div>

<div class="form-card">
  <form method="post">
    <div class="form-grid-2">
      <div class="form-group">
        <label>Student ID <span class="req">*</span></label>
        <input type="text" name="student_id" value="{{ form.get('student_id','') }}" placeholder="e.g. CS2024001" required>
      </div>
      <div class="form-group">
        <label>Full Name <span class="req">*</span></label>
        <input type="text" name="name" value="{{ form.get('name','') }}" placeholder="Full name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ form.get('email','') }}" placeholder="student@example.com">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" name="dob" value="{{ form.get('dob','') }}">
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select name="gender">
          <option value="">— Select —</option>
          <option value="Male"   {% if form.get('gender')=='Male'   %}selected{% endif %}>Male</option>
          <option value="Female" {% if form.get('gender')=='Female' %}selected{% endif %}>Female</option>
          <option value="Other"  {% if form.get('gender')=='Other'  %}selected{% endif %}>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Department <span class="req">*</span></label>
        <select name="department" required>
          <option value="">— Select Department —</option>
          {% for d in departments %}
          <option value="{{ d }}" {% if form.get('department')==d %}selected{% endif %}>{{ d }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Year <span class="req">*</span></label>
        <select name="year" required>
          <option value="">— Select Year —</option>
          {% for y in years %}
          <option value="{{ y }}" {% if form.get('year')==y %}selected{% endif %}>{{ y }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          {% for s in statuses %}
          <option value="{{ s }}" {% if form.get('status','')==s or (not form.get('status') and s=='Active') %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Enrollment Date</label>
        <input type="date" name="enroll_date" value="{{ form.get('enroll_date','') }}">
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" name="address" value="{{ form.get('address','') }}" placeholder="City / State">
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('view_students') }}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary">💾 Register Student</button>
    </div>
  </form>
</div>
{% endblock %}
