{% extends "base.html" %}
{% block title %}Add Student{% endblock %}

{% block content %}

<!-- ── PAGE HEADER ─────────────────────────────── -->
<div class="page-header">
  <h1>Add <span class="gradient-text">New Student</span></h1>
  <p>Fill in the details below to register a new student record</p>
</div>

<!-- ── FORM ────────────────────────────────────── -->
<div class="card form-card">
  <form method="post" action="{{ url_for('add_student') }}">

    <div class="form-grid">

      <!-- ── Personal Information ── -->
      <div class="form-section-title">Personal Information</div>

      <div class="form-group">
        <label class="form-label">Full Name <span class="req">*</span></label>
        <input type="text" name="name" class="form-input"
               placeholder="e.g. Asmit Dahiya"
               value="{{ form.get('name','') }}" required>
      </div>

      <div class="form-group">
        <label class="form-label">Student ID <span class="req">*</span></label>
        <input type="text" name="student_id" class="form-input"
               placeholder="e.g. CS2024001"
               value="{{ form.get('student_id','') }}" required>
      </div>

      <div class="form-group">
        <label class="form-label">Date of Birth</label>
        <input type="date" name="dob" class="form-input"
               value="{{ form.get('dob','') }}">
      </div>

      <div class="form-group">
        <label class="form-label">Gender</label>
        <select name="gender" class="form-input">
          <option value="">Select gender</option>
          {% for g in ['Male','Female','Other'] %}
            <option {% if form.get('gender') == g %}selected{% endif %}>{{ g }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group full">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-input"
               placeholder="student@example.com"
               value="{{ form.get('email','') }}">
      </div>

      <div class="form-group full">
        <label class="form-label">Address / City</label>
        <input type="text" name="address" class="form-input"
               placeholder="e.g. Delhi, India"
               value="{{ form.get('address','') }}">
      </div>

      <!-- ── Academic Information ── -->
      <div class="form-section-title">Academic Information</div>

      <div class="form-group">
        <label class="form-label">Department <span class="req">*</span></label>
        <select name="department" class="form-input" required>
          <option value="">Select department</option>
          {% for d in departments %}
            <option {% if form.get('department') == d %}selected{% endif %}>{{ d }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Academic Year <span class="req">*</span></label>
        <select name="year" class="form-input" required>
          <option value="">Select year</option>
          {% for y in years %}
            <option {% if form.get('year') == y %}selected{% endif %}>{{ y }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Status</label>
        <select name="status" class="form-input">
          {% for st in statuses %}
            <option {% if form.get('status', 'Active') == st %}selected{% endif %}>{{ st }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Enrollment Date</label>
        <input type="date" name="enroll_date" class="form-input"
               value="{{ form.get('enroll_date','') }}">
      </div>

    </div><!-- /form-grid -->

    <!-- ── Actions ── -->
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Register Student →</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
