<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  {% block head %}{% endblock %}
</head>

<body>
  <div class="site-backdrop" aria-hidden="true"></div>

  {% if session.get('user_id') %}
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div>
        <div class="brand">
          <div class="brand-mark">
            <i class="fa-solid fa-layer-group"></i>
          </div>
          <div>
            <div class="brand-title">{{ app_name }}</div>
            <div class="brand-sub">Academic operations platform</div>
          </div>
        </div>

<div class="sidebar-panel">
          <span class="sidebar-label">Workspace</span>
          <strong>{{ current_role|title }} Console</strong>
          <p>Student records, attendance, results, analytics, and secure collaboration in one place.</p>
        </div>

        <nav class="nav-links">
          {% if current_role in ['admin','teacher'] %}
          <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
            <i class="fa-solid fa-chart-line"></i>
            <span>Dashboard</span>
          </a>
