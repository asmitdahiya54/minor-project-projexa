{% extends 'base.html' %}

{% block title %} — Edit Student{% endblock %}

{% block content %}

<div class="page-header">
<h1>Edit Student</h1>
<p>Update student information</p>
</div>

<div class="card">

<div class="card-header">
<div class="card-title">
Edit Record — {{ student.student_id }}
</div>
</div>

<div class="card-body">

<form method="POST">

<div class="form-group">
<label>Full Name</label>
<input type="text" name="full_name" value="{{ student.full_name }}" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" value="{{ student.email }}">
</div>

<div class="form-group">
<label>Phone</label>
<input type="text" name="phone" value="{{ student.phone }}">
</div>

<div class="form-group">
<label>Department</label>

<select name="department">

{% for d in departments %}

<option value="{{ d }}"
{% if student.department == d %}selected{% endif %}>
{{ d }}
</option>

{% endfor %}

</select>

</div>

<div class="form-group">
<label>Academic Year</label>

<select name="academic_year">

{% for y in years %}

<option value="{{ y }}"
{% if student.academic_year == y %}selected{% endif %}>
{{ y }}
</option>

{% endfor %}

</select>

</div>

<div class="form-group">
<label>Status</label>

<select name="status">

{% for s in statuses %}

<option value="{{ s }}"
{% if student.status == s %}selected{% endif %}>
{{ s }}
</option>

{% endfor %}

</select>

</div>

<div class="form-group">
<label>Date of Birth</label>
<input type="date" name="date_of_birth" value="{{ student.date_of_birth }}">
</div>

<div class="form-group">
<label>Enrollment Date</label>
<input type="date" name="enrollment_date" value="{{ student.enrollment_date }}">
</div>

<div class="form-group">
<label>Address</label>
<input type="text" name="address" value="{{ student.address }}">
</div>

<div class="form-group">
<label>Notes</label>
<textarea name="notes">{{ student.notes }}</textarea>
</div>

<br>

<button type="submit" class="btn btn-primary">
Update Student
</button>

<a href="{{ url_for('view_students') }}" class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</div>

{% endblock %}
