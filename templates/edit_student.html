{% extends "base.html" %}

{% block content %}
<h1>Edit Student</h1>

<form method="POST">

<p>Full Name:<br>
<input type="text" name="full_name" value="{{ student.full_name }}" required></p>

<p>Email:<br>
<input type="email" name="email" value="{{ student.email }}"></p>

<p>Phone:<br>
<input type="text" name="phone" value="{{ student.phone }}"></p>

<p>Department:<br>
<input type="text" name="department" value="{{ student.department }}"></p>

<p>Academic Year:<br>
<input type="text" name="academic_year" value="{{ student.academic_year }}"></p>

<p>Status:<br>
<select name="status">
<option value="Active" {% if student.status=='Active' %}selected{% endif %}>Active</option>
<option value="Graduated" {% if student.status=='Graduated' %}selected{% endif %}>Graduated</option>
<option value="On Leave" {% if student.status=='On Leave' %}selected{% endif %}>On Leave</option>
</select></p>

<button type="submit">Update Student</button>

</form>

{% endblock %}
