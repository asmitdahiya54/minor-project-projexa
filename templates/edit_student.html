{% extends "base.html" %}
{% block title %}Edit {{ student.name }}{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <a href="{{ url_for('student_detail', sid=student.id) }}" class="back-link">← Back to {{ student.name }}</a>
    <h1 class="page-title">✏️ Edit Student</h1>
    <p class="page-sub">{{ student.student_id }}</p>
  </div>
</div>
div class="form-card">
  <form method="post">
    <div class="form-grid-2">
      <div class="form-group">
        <label>Full Name <span class="req">*</span></label>
        <input type="text" name="name" value="{{ student.name }}" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ student.email or '' }}">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" name="dob" value="{{ student.dob or '' }}">
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select name="gender">
          <option value="">— Select —</option>
          <option value="Male"   {% if student.gender=='Male'   %}selected{% endif %}>Male</option>
          <option value="Female" {% if student.gender=='Female' %}selected{% endif %}>Female</option>
          <option value="Other"  {% if student.gender=='Other'  %}selected{% endif %}>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Department <span class="req">*</span></label>
        <select name="department" required>
          {% for d in departments %}
          <option value="{{ d }}" {% if student.department==d %}selected{% endif %}>{{ d }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Year <span class="req">*</span></label>
        <select name="year" required>
          {% for y in years %}
          <option value="{{ y }}" {% if student.year==y %}selected{% endif %}>{{ y }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          {% for s in statuses %}
          <option value="{{ s }}" {% if student.status==s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Enrollment Date</label>
        <input type="date" name="enroll_date" value="{{ student.enroll_date or '' }}">
      </div>
      <div class="form-group full">
        <label>Address</label>
        <input type="text" name="address" value="{{ student.address or '' }}" placeholder="City / State">
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('student_detail', sid=student.id) }}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary">💾 Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
