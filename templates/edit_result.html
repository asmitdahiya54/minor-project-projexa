{% extends "base.html" %}
{% block title %}Edit Result{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <a href="{{ url_for('student_results', sid=student.id) }}" class="back-link">← Back to {{ student.name }}'s Results</a>
    <h1 class="page-title">✏️ Edit Result</h1>
    <p class="page-sub">{{ student.name }} · {{ student.student_id }}</p>
  </div>
</div>

<div class="form-card">
  <form method="post">
    <div class="form-grid-2">
      <div class="form-group">
        <label>Subject <span class="req">*</span></label>
        <select name="subject" required>
          {% for s in subjects %}
          <option value="{{ s }}" {% if result.subject==s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Exam Type</label>
        <select name="exam_type">
          {% for e in exam_types %}
          <option value="{{ e }}" {% if result.exam_type==e %}selected{% endif %}>{{ e }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Semester <span class="req">*</span></label>
        <select name="semester" required>
          {% for s in semesters %}
          <option value="{{ s }}" {% if result.semester==s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Max Marks</label>
        <input type="number" name="max_marks" id="maxMarks"
               value="{{ result.max_marks|int }}" min="1" step="0.5" oninput="calcGrade()">
      </div>

      <div class="form-group full">
        <label>Marks Obtained <span class="req">*</span></label>
        <input type="number" name="marks_obtained" id="marksObtained"
               value="{{ result.marks_obtained|int }}" min="0" step="0.5" required oninput="calcGrade()">
      </div>

      <div class="form-group full">
        <label>Remarks</label>
        <input type="text" name="remarks" value="{{ result.remarks or '' }}" placeholder="Optional notes...">
      </div>
    </div>

    <div class="grade-preview" id="gradePreview">
      <div class="gp-row">
        <div class="gp-item">
          <span class="gp-label">Score</span>
          <span class="gp-val" id="gpPct">—</span>
        </div>
        <div class="gp-item">
          <span class="gp-label">Grade</span>
          <span class="gp-val grade-big" id="gpGrade">{{ result.grade }}</span>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('student_results', sid=student.id) }}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary">💾 Update Result</button>
    </div>
  </form>
</div>
<script>
function calcGrade() {
  const m=parseFloat(document.getElementById('marksObtained').value);
  const mx=parseFloat(document.getElementById('maxMarks').value)||100;
  if(isNaN(m)) return;
  const pct=Math.min(m/mx*100,100);
  let grade,color;
  if(pct>=90){grade='O';color='#10b981'}
  else if(pct>=80){grade='A+';color='#3b82f6'}
  else if(pct>=70){grade='A';color='#6366f1'}
  else if(pct>=60){grade='B+';color='#f59e0b'}
  else if(pct>=50){grade='B';color='#f97316'}
  else if(pct>=40){grade='C';color='#ef4444'}
  else{grade='F';color='#dc2626'}
  document.getElementById('gpPct').textContent=pct.toFixed(1)+'%';
  document.getElementById('gpGrade').textContent=grade;
  document.getElementById('gpGrade').style.color=color;
}
calcGrade();
</script>
{% endblock %}
