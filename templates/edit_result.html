{% extends "base.html" %}
{% block title %}Edit Result | {{ app_name }}{% endblock %}
{% block page_heading %}Edit Result{% endblock %}

{% block content %}
<section class="panel panel--form">
  <div class="panel__header">
    <div>
      <h3>Update result record</h3>
      <p>Edit the published score while keeping the student link unchanged.</p>
    </div>
  </div>

  <form method="post" class="data-form js-ajax-form" data-redirect-on-success="true">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-grid">
      <label>
        <span>Student</span>
        <input type="text" value="{{ student.name }} ({{ student.student_id }})" disabled>
      </label>

      <label>
        <span>Subject</span>
        <select name="subject">
          {% for subject in subjects %}
          <option value="{{ subject }}" {% if result.subject == subject %}selected{% endif %}>{{ subject }}</option>
          {% endfor %}
        </select>
      </label>

      <label>
        <span>Exam type</span>
        <select name="exam_type">
          {% for exam in exam_types %}
          <option value="{{ exam }}" {% if result.exam_type == exam %}selected{% endif %}>{{ exam }}</option>
          {% endfor %}
        </select>
      </label>

      <label>
        <span>Semester</span>
        <select name="semester">
          {% for sem in semesters %}
          <option value="{{ sem }}" {% if result.semester == sem %}selected{% endif %}>{{ sem }}</option>
          {% endfor %}
        </select>
      </label>

      <label>
        <span>Marks obtained</span>
        <input type="number" name="marks_obtained" min="0" step="0.01" value="{{ result.marks_obtained }}" required>
      </label>

      <label>
        <span>Maximum marks</span>
        <input type="number" name="max_marks" min="1" step="0.01" value="{{ result.max_marks }}" required>
      </label>

      <label class="form-grid__full">
        <span>Remarks</span>
        <input type="text" name="remarks" value="{{ result.remarks or '' }}">
      </label>
    </div>

    <div class="form-actions">
      <a class="btn btn-secondary" href="{{ url_for('student_results', student_id=student.id) }}">Cancel</a>
      <button class="btn btn-primary" type="submit">
        <i class="fa-solid fa-floppy-disk"></i>
        <span>Update result</span>
      </button>
    </div>
  </form>
</section>
{% endblock %}
