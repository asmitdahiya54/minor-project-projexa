{% extends "base.html" %}
{% block title %}Change Password | {{ app_name }}{% endblock %}
{% block page_heading %}Security Settings{% endblock %}

{% block content %}
<section class="panel panel--form narrow-panel">
  <div class="panel__header">
    <div>
      <h3>Update your password</h3>
      <p>Choose a stronger password with at least 8 characters to keep your account secure.</p>
    </div>
  </div>

  <form method="post" class="data-form js-ajax-form" data-redirect-on-success="true">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>
      <span>Current password</span>
      <input type="password" name="current_password" required>
    </label>
