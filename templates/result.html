{% extends "base.html" %}
{% block title %}Results{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">🎓 Results</h1>
    <p class="page-sub">Manage student exam results and grades</p>
  </div>
  <a href="{{ url_for('add_result') }}" class="btn btn-primary">＋ Add Result</a>
</div>

<!-- Summary -->
<div class="res-summary">
  <div class="res-sum-card">
    <span class="res-sum-num">{{ total_results }}</span>
    <span class="res-sum-lbl">Total Records</span>
  </div>
  <div class="res-sum-card" style="--c:#3b82f6;--cb:#dbeafe">
    <span class="res-sum-num">{{ avg_pct }}%</span>
    <span class="res-sum-lbl">Avg Score</span>
  </div>
</div>


<!-- Filters -->
<div class="filter-bar" style="margin-bottom:1.5rem">
  <form method="get" class="filter-form" id="ff">
    <div class="filter-group">
      <label> Search</label>
      <input type="text" name="search" value="{{ filters.search }}" placeholder="Name / ID / Subject...">
    </div>
    <div class="filter-group">
      <label> Department</label>
      <select name="dept" onchange="ff.submit()">
        <option value="">All</option>
        {% for d in departments %}
        <option value="{{ d }}" {% if filters.dept==d %}selected{% endif %}>{{ d }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="filter-group">
      <label> Semester</label>
      <select name="semester" onchange="ff.submit()">
        <option value="">All</option>
        {% for s in semesters %}
        <option value="{{ s }}" {% if filters.semester==s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="filter-group">
      <label> Exam Type</label>
      <select name="exam" onchange="ff.submit()">
        <option value="">All</option>
        {% for e in exam_types %}
        <option value="{{ e }}" {% if filters.exam==e %}selected{% endif %}>{{ e }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-outline">Search</button>
  </form>
</div>
