{% extends "base.html" %}
{% block title %}Add Result{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <a href="{{ url_for('results') }}" class="back-link">← Back to Results</a>
    <h1 class="page-title">Add Result</h1>
    <p class="page-sub">Enter exam marks for a student</p>
  </div>
</div>

<div class="form-card">
  <form method="post" id="resultForm">
    <div class="form-grid-2">
      <div class="form-group full">
        <label>Student <span class="req">*</span></label>
        <select name="student_id" id="studentSel" required>
          <option value="">— Select Student —</option>
          {% for s in students %}
          <option value="{{ s.id }}" {% if pre_sid and pre_sid|int == s.id %}selected{% endif %}>
            {{ s.name }} ({{ s.student_id }}) — {{ s.department }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Subject <span class="req">*</span></label>
        <select name="subject" required>
          {% for s in subjects %}
          <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Exam Type</label>
        <select name="exam_type">
          {% for e in exam_types %}
          <option value="{{ e }}">{{ e }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Semester <span class="req">*</span></label>
        <select name="semester" required>
          <option value="">— Select Semester —</option>
          {% for s in semesters %}
          <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Marks Obtained <span class="req">*</span></label>
        <input type="number" name="marks_obtained" id="marksObtained"
               min="0" step="0.5" placeholder="e.g. 78" required oninput="calcGrade()">
      </div>

      <div class="form-group">
        <label>Max Marks</label>
        <input type="number" name="max_marks" id="maxMarks"
               min="1" step="0.5" value="100" oninput="calcGrade()">
      </div>

      <div class="form-group full">
        <label>Remarks (optional)</label>
        <input type="text" name="remarks" placeholder="Any notes about this result...">
      </div>
    </div>
