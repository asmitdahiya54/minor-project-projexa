{% extends "base.html" %}
{% block title %}Submit Feedback{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <a href="{{ url_for('feedback') }}" class="back-link">← Back to Feedback</a>
    <h1 class="page-title">➕ Submit Feedback</h1>
    <p class="page-sub">Record student feedback and rating</p>
  </div>
</div>

<div class="form-card">
  <form method="post">
    <div class="form-grid-2">
      <div class="form-group full">
        <label>Student <span class="req">*</span></label>
        <select name="student_id" required>
          <option value="">— Select Student —</option>
          {% for s in students %}
          <option value="{{ s.id }}"
            {% if pre_sid and pre_sid|int == s.id %}selected{% endif %}>
            {{ s.name }} ({{ s.student_id }}) — {{ s.department }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Category</label>
        <select name="category">
          {% for c in categories %}
          <option value="{{ c }}">{{ c }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Rating <span class="req">*</span></label>
        <div class="star-picker" id="starPicker">
          {% for i in range(1,6) %}
          <label class="star-label" for="star{{ i }}">
            <input type="radio" name="rating" id="star{{ i }}" value="{{ i }}"
              {% if i==3 %}checked{% endif %}>
            <span class="star-btn">★</span>
          </label>
          {% endfor %}
        </div>
        <span class="rating-hint" id="ratingHint">3 stars – Average</span>
      </div>

      <div class="form-group full">
        <label>Feedback Message <span class="req">*</span></label>
        <textarea name="message" rows="4" placeholder="Write feedback here..." required
          style="padding:.65rem .85rem;border:1.5px solid var(--border);border-radius:9px;font-size:.9rem;resize:vertical;font-family:inherit;background:var(--bg);color:var(--text)"></textarea>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('feedback') }}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary">💾 Submit Feedback</button>
    </div>
  </form>
</div>
<script>
const hints = {1:'1 star – Poor',2:'2 stars – Fair',3:'3 stars – Average',4:'4 stars – Good',5:'5 stars – Excellent'};
document.querySelectorAll('input[name="rating"]').forEach(r => {
  r.addEventListener('change', () => {
    document.getElementById('ratingHint').textContent = hints[r.value];
  });
});
// Highlight stars properly (CSS-only rtl trick works, but let's reinforce with JS)
const starLabels = document.querySelectorAll('.star-btn');
document.querySelectorAll('input[name="rating"]').forEach((r,i) => {
  r.addEventListener('change', () => {
    starLabels.forEach((s,j) => {
      s.style.color = j <= i ? '#f59e0b' : '#d1d5db';
    });
  });
});
// Set initial highlight for default 3-star
starLabels.forEach((s,j) => { s.style.color = j < 3 ? '#f59e0b' : '#d1d5db'; });
</script>
{% endblock %}
