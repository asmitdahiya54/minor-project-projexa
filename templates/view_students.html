{% extends 'base.html' %}

{% block content %}

<h2>All Students</h2>

{% if students %}

<table border="1">

<tr>
<th>ID</th>
<th>Name</th>
</tr>

{% for s in students %}

<tr>
<td>{{ s.student_id }}</td>
<td>
<a href="{{ url_for('student_detail', sid=s.id) }}">
{{ s.full_name }}
</a>
</td>
<td>
<a href="{{ url_for('edit_student', id=s.id) }}">Edit</a>
</td>
</tr>

{% endfor %}

</table>

{% else %}

<p>No students found</p>

{% endif %}

{% endblock %}
