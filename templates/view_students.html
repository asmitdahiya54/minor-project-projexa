{% extends 'base.html' %}

{% block content %}

<h2>All Students</h2>

{% if students %}

<table border="1">

<tr>
<th>ID</th>
<th>Name</th>
</tr>

{% for s in students %}

<tr>
<td>{{ s.student_id }}</td>
<td>
<a href="{{ url_for('student_detail', sid=s.id) }}">
{{ s.full_name }}
</a>
</td>

<td>
<a href="{{ url_for('edit_student', id=s.id) }}">Edit</a>

<form method="POST" action="{{ url_for('delete_student', id=s.id) }}" style="display:inline;">
    <button type="submit" onclick="return confirm('Delete this student?')">
        Delete
    </button>
</form>

</td>

</tr>

{% endfor %}

</table>

{% else %}

<p>No students found</p>

{% endif %}

{% endblock %}
